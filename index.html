<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 약품 통계 분석기 (Web)</title>
    
    <!-- 아이콘(파비콘) 설정 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="icon.png" type="image/png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4CAF50;
            --danger: #f44336;
            --info: #2196F3;
            --warning: #FF9800;
            --brown: #795548;
            --purple: #9C27B0;
            --bg-color: #f5f5f5;
            --border-color: #ddd;
        }
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #fff; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
        
        /* Dropzone */
        #drop-zone {
            flex: 1; border: 4px dashed #757575; border-radius: 15px; background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            font-size: 22px; color: #424242; font-weight: bold; transition: all 0.3s;
        }
        #drop-zone.dragover { background-color: #e8f5e9; border-color: var(--primary); }
        
        /* Help Buttons */
        .btn-help {
            background-color: #607D8B; color: white; padding: 10px 25px; font-size: 15px; 
            border-radius: 25px; border: none; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-help:hover { background-color: #455A64; transform: scale(1.02); }
        .help-container { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }

        /* Help Modal (Popup) */
        #help-modal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.75);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content { max-width: 90%; max-height: 85vh; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .modal-close {
            color: white; font-size: 40px; font-weight: bold; align-self: flex-end; 
            margin-right: 5%; margin-bottom: 10px; cursor: pointer;
        }
        .modal-close:hover { color: #ccc; }

        /* Device Choice Modal */
        #device-choice-modal {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);
            justify-content: center; align-items: center;
        }
        .choice-box {
            background: white; padding: 30px 40px; border-radius: 12px;
            text-align: center; box-shadow: 0 4px 25px rgba(0,0,0,0.3); width: 320px;
        }
        .choice-box h3 { margin-top: 0; color: #333; margin-bottom: 20px; }
        .choice-btn {
            display: block; width: 100%; padding: 14px; margin: 12px 0;
            background-color: var(--primary); color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s;
        }
        .choice-btn:hover { background-color: #388E3C; }
        .choice-btn.alt { background-color: #607D8B; }
        .choice-btn.alt:hover { background-color: #455A64; }

        /* Workspace */
        #workspace { display: none; flex-direction: column; height: 100%; }
        
        /* Controls */
        .controls-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        select, input[type="text"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-reload { background-color: var(--danger); }
        .btn-run { background-color: var(--primary); }
        .btn-merge { background-color: var(--brown); }
        .btn-merge.merged { background-color: var(--warning); }
        .btn-search { background-color: var(--info); padding: 6px 12px; }
        .btn-unhide { background-color: var(--purple); padding: 6px 12px; display: none; }
        .btn-hide-row { background-color: #e0e0e0; color: #333; padding: 4px 8px; font-size: 12px; }

        /* Status 4 Grid Layout */
        #status-info { 
            display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; 
            color: #d32f2f; font-weight: bold; font-size: 14px; margin-bottom: 10px; 
            background-color: #fff3f3; border: 1px solid #ffcdd2; border-radius: 5px;
        }
        #status-info > div { 
            padding: 10px; text-align: center; border-right: 1px solid #ffcdd2; 
            word-break: keep-all; line-height: 1.4;
        }
        #status-info > div:last-child { border-right: none; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 10px; }
        .tab-btn { background: none; color: #333; border: none; padding: 10px 20px; cursor: pointer; font-size: 15px; border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 0; }
        .tab-btn.active { font-weight: bold; border-bottom-color: var(--info); }
        
        /* Tables */
        .tab-content { display: none; flex: 1; overflow: auto; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; }
        th { background-color: var(--bg-color); position: sticky; top: 0; cursor: pointer; user-select: none; }
        th:hover { background-color: #e0e0e0; }
        tr.hidden { display: none; }
        tr.highlight { background-color: #fff9c4 !important; }
        tr:nth-child(even) { background-color: #fafafa; }
    </style>
</head>
<body>

    <!-- 도움말 팝업(모달) -->
    <div id="help-modal" onclick="closeHelp()">
        <span class="modal-close">&times;</span>
        <img id="modal-img" class="modal-content" src="" alt="도움말 이미지" onclick="event.stopPropagation()">
    </div>

    <!-- 기기 선택 팝업(모달) -->
    <div id="device-choice-modal">
        <div class="choice-box">
            <h3 id="device-choice-title">기기를 확인해주세요.</h3>
            <button id="btn-choice-1" class="choice-btn"></button>
            <button id="btn-choice-2" class="choice-btn alt"></button>
        </div>
    </div>

    <!-- 파일 드롭존 -->
    <div id="drop-zone">
        <div id="drop-message">
            이곳에<br>[ ATDPS 전송 약품 보고서 ] 와 [ 약품 설정 ] 엑셀 파일 두 개를<br>함께 끌어다 놓아주세요.
        </div>
        <div class="help-container">
            <button class="btn-help" onclick="showHelp('help1.png', event)">💡 어떤 파일을 올려야 할지 모른다면 여기를 클릭</button>
            <button class="btn-help" onclick="showHelp('help2.png', event)">💡 'ATDPS 전송 약품 보고서'가 안 보인다면 여기를 클릭</button>
        </div>
    </div>

    <!-- 메인 작업 화면 -->
    <div id="workspace">
        <div class="controls-row">
            <button class="btn-reload" onclick="resetApp()">🔄 파일들 다시 올리기</button>
            <span style="font-weight: bold; margin-left: 10px;">| 기기 설정:</span>
            <select id="combo-device" onchange="handleDeviceChange()"></select>
            
            <span style="font-weight: bold;">적용범위:</span>
            <select id="combo-scope">
                <option value="전체기기">전체기기</option>
                <option value="해당기기">해당기기</option>
            </select>
            
            <span style="font-weight: bold;">제품정보:</span>
            <select id="combo-product">
                <option value="207DO">207DO</option>
                <option value="208DO">208DO</option>
                <option value="243DO">243DO</option>
                <option value="244DO">244DO</option>
                <option value="300NS">300NS</option>
                <option value="360NS">360NS</option>
                <option value="420NS">420NS</option>
                <option value="480NS">480NS</option>
                <option value="576NS">576NS</option>
            </select>
            
            <button class="btn-run" onclick="processData(true)">📊 조건에 맞춰 결과 갱신</button>
            <button id="btn-merge" class="btn-merge" onclick="toggleMerge()">🔗 다중코드 개별로 보기</button>
        </div>

        <div class="controls-row">
            <div id="status-info">
                <div style="grid-column: span 4; text-align: left; border: none;">데이터를 분석 중입니다...</div>
            </div>
        </div>

        <div class="controls-row" style="background-color: var(--bg-color); padding: 10px; border-radius: 5px;">
            <span style="font-weight: bold;">데이터 검색:</span>
            <select id="combo-search-col">
                <option value="약품명">약품명</option>
                <option value="약품코드">약품코드</option>
                <option value="번호">번호</option>
            </select>
            <input type="text" id="input-search" placeholder="검색어를 입력하고 Enter를 누르세요." style="width: 250px;" onkeypress="if(event.key==='Enter') performSearch()">
            <button class="btn-search" onclick="performSearch()">🔍 검색 (다음 찾기)</button>
            <button id="btn-unhide" class="btn-unhide" onclick="unhideAll()">👁️ 숨김 해제</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('out')">Out 목록</button>
            <button class="tab-btn" onclick="switchTab('in')">In 목록</button>
            <button class="tab-btn" onclick="switchTab('dup')">중복 목록</button>
        </div>

        <div id="tab-out" class="tab-content active">
            <table id="table-out"><thead></thead><tbody></tbody></table>
        </div>
        <div id="tab-in" class="tab-content">
            <table id="table-in"><thead></thead><tbody></tbody></table>
        </div>
        <div id="tab-dup" class="tab-content">
            <table id="table-dup"><thead></thead><tbody></tbody></table>
        </div>
    </div>

<script>
    let rawAtdps = null;
    let rawSettings = null;
    let isMerged = true;
    
    let outData = [], inData = [], dupData = [];
    let currentSort = { out: { col: '수량', asc: true }, in: { col: '수량', asc: false }, dup: { col: '번호', asc: true } };
    let searchIndex = { out: -1, in: -1, dup: -1 };

    // 기기별 맞춤 오토 넘버링 (추가/수정이 필요할 경우 여기에 작성)
    const autoMap = {
        '207': { '오토1': [7, 14, 21], '오토2': [28, 35, 42], '오토3': [49, 55, 60], '오토4': [65, 70, 75] },
        '208': { '오토1': [6, 12, 18], '오토2': [24, 30, 36], '오토3': [42, 48, 52], '오토4': [56, 60, 64] },
        '243': { '오토1': [6, 12, 18], '오토2': [24, 30, 36], '오토3': [42, 47, 51], '오토4': [55, 59, 63] },
        '360': { '오토1': [6, 12, 18, 24], '오토2': [66, 72, 78, 84], '오토3': [126, 132, 138, 144], '오토4': [186, 192, 198, 204], '오토5': [246, 252, 258, 264], '오토6': [306, 312, 318, 324] }
    };

    const dropZone = document.getElementById('drop-zone');
    const workspace = document.getElementById('workspace');
    
    function showHelp(imgSrc, event) {
        if(event) event.stopPropagation(); 
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('help-modal').style.display = 'flex';
    }
    
    function closeHelp() {
        document.getElementById('help-modal').style.display = 'none';
        document.getElementById('modal-img').src = '';
    }

    function askDeviceChoice(maxNum) {
        return new Promise((resolve) => {
            const modal = document.getElementById('device-choice-modal');
            const title = document.getElementById('device-choice-title');
            const btn1 = document.getElementById('btn-choice-1');
            const btn2 = document.getElementById('btn-choice-2');

            title.innerHTML = `기기를 확인해주세요.<br><span style="font-size:14px; color:#555; font-weight:normal;">(확인된 최고 번호: ${maxNum}번)</span>`;
            
            if (maxNum === 207) {
                btn1.textContent = "207DO [구형]";
                btn1.onclick = () => { modal.style.display = 'none'; resolve('207DO'); };
                btn2.textContent = "208DO (208번 미사용)";
                btn2.onclick = () => { modal.style.display = 'none'; resolve('208DO'); };
            } else if (maxNum === 243) {
                btn1.textContent = "243DO [구형]";
                btn1.onclick = () => { modal.style.display = 'none'; resolve('243DO'); };
                btn2.textContent = "244DO (244번 미사용)";
                btn2.onclick = () => { modal.style.display = 'none'; resolve('244DO'); };
            }
            modal.style.display = 'flex';
        });
    }
    
    function getDropZoneHTML(msgText) {
        return `
            <div id="drop-message">${msgText}</div>
            <div class="help-container">
                <button class="btn-help" onclick="showHelp('help1.png', event)">💡 어떤 파일을 올려야 할지 모른다면 여기를 클릭</button>
                <button class="btn-help" onclick="showHelp('help2.png', event)">💡 'ATDPS 전송 약품 보고서'가 안 보인다면 여기를 클릭</button>
            </div>
        `;
    }

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.xls') || f.name.endsWith('.xlsx'));
        
        if(files.length > 2) {
            alert("파일이 3개 이상입니다.\n통계에 필요한 엑셀 파일 2개만 끌어다 놓아주세요."); return;
        }
        
        let atdpsFile = null, settingsFile = null;
        for (let file of files) {
            const type = await checkFileType(file);
            if (type === 'ATDPS') atdpsFile = file;
            else if (type === 'SETTINGS') settingsFile = file;
            else {
                alert(`이 파일은 분석 양식에 맞지 않습니다.\n\n파일명: ${file.name}\n올바른 파일을 다시 끌어다 놓아주세요.`); return;
            }
        }

        if (files.length === 2 && (!atdpsFile || !settingsFile)) {
            alert("[ ATDPS 전송 약품 보고서 ]와 [ 약품 설정 ] 파일이 각각 하나씩 필요합니다.\n제대로 된 파일을 확인하고 다시 올려주세요.");
            resetApp(); return;
        }

        if (atdpsFile && settingsFile) {
            dropZone.innerHTML = `<div id="drop-message">데이터를 처리 중입니다... 잠시만 기다려주세요.</div>`;
            await loadData(atdpsFile, settingsFile);
        } else {
            let msg = "";
            if (atdpsFile) msg += "[ ATDPS 전송 약품 보고서 ] 확인 완료<br>";
            if (settingsFile) msg += "[ 약품 설정 ] 확인 완료<br>";
            dropZone.innerHTML = getDropZoneHTML(msg + "나머지 1개의 파일도 올려주세요.");
        }
    });

    function readFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                const uint8 = new Uint8Array(buffer);

                let isRealExcel = false;
                if (uint8.length >= 4) {
                    const hex = Array.from(uint8.slice(0, 4)).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
                    if (hex === 'D0CF11E0' || hex === '504B0304') {
                        isRealExcel = true;
                    }
                }

                if (isRealExcel) {
                    try {
                        const workbook = XLSX.read(buffer, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        resolve(XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""}));
                    } catch(err) { resolve([]); }
                } 
                else {
                    let decoder = new TextDecoder('euc-kr'); 
                    let text = decoder.decode(buffer);
                    
                    if (!text.includes('약품') && !text.includes('ATDPS') && !text.includes('캐니스터')) {
                        decoder = new TextDecoder('utf-8');
                        text = decoder.decode(buffer);
                    }

                    if (text.toLowerCase().includes('<table')) {
                        try {
                            const workbook = XLSX.read(text, {type: 'string'});
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            resolve(XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""}));
                            return;
                        } catch(err) {}
                    }

                    const rows = text.split('\n').map(r => r.split('\t').map(c => c.trim()));
                    resolve(rows);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    async function checkFileType(file) {
        let json = await readFile(file);
        if (!json || json.length === 0) return "UNKNOWN";
        
        let headerText = "";
        for(let i=0; i < Math.min(json.length, 10); i++) {
            headerText += json[i].join("") + " ";
        }
        
        let cleanText = headerText.replace(/\s+/g, '');
        if (cleanText.includes('[ATDPS') || cleanText.includes('ATDPS전송') || (cleanText.includes('약품코드') && cleanText.includes('총사용량'))) return 'ATDPS';
        if (cleanText.includes('[약품설정]') || (cleanText.includes('약품코드') && cleanText.includes('일반약품명'))) return 'SETTINGS';
        return "UNKNOWN";
    }

    function cleanCode(val) {
        if (val === null || val === undefined || val === '') return "";
        let str = String(val).trim();
        if (!isNaN(str) && str.toUpperCase().includes('E')) return String(Math.floor(Number(str)));
        if (!isNaN(str) && str !== "") return String(Math.floor(Number(str))); 
        return str;
    }

    async function loadData(fileA, fileS) {
        const jsonA = await readFile(fileA);
        const jsonS = await readFile(fileS);

        let startIdxA = -1, headA = [];
        for(let i=0; i < Math.min(jsonA.length, 10); i++) {
            let rowStr = jsonA[i].join("").replace(/\s+/g, "");
            if (rowStr.includes("약품코드") && rowStr.includes("총사용량")) {
                startIdxA = i + 1; 
                headA = jsonA[i].map(c => String(c||"").replace(/\s+/g, ""));
                break;
            }
        }

        let startIdxS = -1, headS = [];
        for(let i=0; i < Math.min(jsonS.length, 10); i++) {
            let rowStr = jsonS[i].join("").replace(/\s+/g, "");
            if (rowStr.includes("약품코드") && rowStr.includes("제품ID")) {
                startIdxS = i + 1; 
                headS = jsonS[i].map(c => String(c||"").replace(/\s+/g, ""));
                break;
            }
        }
        
        if (startIdxA === -1 || startIdxS === -1) {
            alert("데이터 구조(열 이름)를 찾을 수 없습니다. 열 이름(약품코드, 제품ID 등)이 정상적으로 들어있는지 확인해 주세요.");
            resetApp(); return;
        }

        let ca_dev = headA.findIndex(c => c.includes("제품ID"));
        let ca_code = headA.findIndex(c => c.includes("약품코드"));
        let ca_name = headA.findIndex(c => c.includes("약품명"));
        let ca_qty = headA.findIndex(c => c.includes("총사용량"));
        let ca_cnt = headA.findIndex(c => c.includes("횟수"));

        let cs_code = headS.findIndex(c => c.includes("약품코드"));
        let cs_name = headS.findIndex(c => c.includes("일반약품명") || c.includes("약품명"));
        let cs_can = headS.findIndex(c => c.includes("캐니스터번호"));
        let cs_dev = headS.findIndex(c => c.includes("제품ID"));

        rawAtdps = [];
        for (let i = startIdxA; i < jsonA.length; i++) {
            let row = jsonA[i];
            if(!row || !row[ca_code]) continue;
            rawAtdps.push({
                deviceId: String(row[ca_dev]||"").trim(),
                code: cleanCode(row[ca_code]),
                name: String(row[ca_name]||"").trim(),
                qty: Number(row[ca_qty]) || 0,
                count: Number(row[ca_cnt]) || 0
            });
        }

        rawSettings = [];
        for (let i = startIdxS; i < jsonS.length; i++) {
            let row = jsonS[i];
            if(!row || !row[cs_can] || String(row[cs_can]).trim() === "") continue; 
            rawSettings.push({
                code: cleanCode(row[cs_code]),
                name: String(row[cs_name]||"").trim(),
                canNo: Number(row[cs_can]),
                deviceId: String(row[cs_dev]||"").trim()
            });
        }

        const totalCount = rawAtdps.reduce((sum, r) => sum + r.count, 0);
        if (totalCount <= 10000) {
            const proceed = confirm("데이터 양이 너무 작습니다.\n\n3개월 이상의 데이터 날짜 지정 후 우측 상단의 '검색' 버튼을 눌러서 해당 날짜 구간으로 데이터 갱신 후, 좌측 하단의 '엑셀' 버튼을 눌러 데이터를 다시 받은 것이 맞는지 다시 한번 확인해 주시기 바랍니다.\n\n이 데이터로 통계를 내는 것이 맞습니까?");
            if (!proceed) { resetApp(); return; }
        }

        dropZone.style.display = 'none';
        workspace.style.display = 'flex';
        
        updateDeviceCombo();
        await updateDefaultProduct();
        processData(false);
    }

    function resetApp() {
        rawAtdps = null; rawSettings = null;
        document.getElementById('btn-unhide').style.display = 'none';
        
        const defaultMsg = "이곳에<br>[ ATDPS 전송 약품 보고서 ] 와 [ 약품 설정 ] 엑셀 파일 두 개를<br>함께 끌어다 놓아주세요.";
        dropZone.innerHTML = getDropZoneHTML(defaultMsg);
        
        dropZone.style.display = 'flex';
        workspace.style.display = 'none';
    }

    function updateDeviceCombo() {
        const devices = new Set();
        rawAtdps.forEach(r => devices.add(r.deviceId));
        rawSettings.forEach(r => devices.add(r.deviceId));
        
        const sorted = Array.from(devices).sort();
        const combo = document.getElementById('combo-device');
        combo.innerHTML = '';
        sorted.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d; opt.textContent = d;
            combo.appendChild(opt);
        });
    }
    
    // 기기 설정 변경 시 자동으로 모델 추론 후 통계 갱신
    async function handleDeviceChange() {
        await updateDefaultProduct();
        // 기기 변경 시에는 알림창 없이 즉시 반영
    }

    async function updateDefaultProduct() {
        const targetDevice = document.getElementById('combo-device').value;
        let maxNum = 0;
        rawSettings.forEach(r => {
            if (r.deviceId === targetDevice && r.canNo > maxNum) maxNum = r.canNo;
        });
        
        let bestFit = "";
        if (maxNum === 207 || maxNum === 243) {
            // 사용자에게 구형/미사용 여부를 묻는 팝업
            bestFit = await askDeviceChoice(maxNum);
        } else {
            const products = [207, 208, 243, 244, 300, 360, 420, 480, 576];
            let matched = 576;
            for (let p of products) {
                if (p >= maxNum) { matched = p; break; }
            }
            if (matched === 207) bestFit = "207DO";
            else if (matched === 208) bestFit = "208DO";
            else if (matched === 243) bestFit = "243DO";
            else if (matched === 244) bestFit = "244DO";
            else bestFit = matched + "NS"; 
        }
        document.getElementById('combo-product').value = bestFit; 
    }

    function toggleMerge() {
        isMerged = !isMerged;
        const btn = document.getElementById('btn-merge');
        if (isMerged) {
            btn.textContent = "🔗 다중코드 개별로 보기";
            btn.className = "btn-merge";
            alert("중복코드가 성공적으로 하나로 통합되었습니다.");
        } else {
            btn.textContent = "🔗 다중코드 중복 통합하기";
            btn.className = "btn-merge merged";
            alert("중복코드가 개별 보기로 전환되었습니다.");
        }
        processData(false);
    }

    function processData(showPopup) {
        if (!rawAtdps || !rawSettings) return;

        const targetDevice = document.getElementById('combo-device').value;
        const scope = document.getElementById('combo-scope').value;
        
        const productVal = document.getElementById('combo-product').value;
        const productPrefix = productVal.replace(/[^0-9]/g, ''); // 숫자만 추출 (예: '208DO' -> '208')
        const maxCan = parseInt(productPrefix);

        const allDevices = Array.from(new Set(rawSettings.map(r => r.deviceId))).sort();
        const otherDevices = allDevices.filter(d => d !== targetDevice);
        
        const deviceCanMap = {};
        otherDevices.forEach(d => {
            deviceCanMap[d] = {};
            rawSettings.filter(r => r.deviceId === d).forEach(r => {
                if(!deviceCanMap[d][r.code]) deviceCanMap[d][r.code] = r.canNo;
            });
        });

        let filteredA = scope === '해당기기' ? rawAtdps.filter(r => r.deviceId === targetDevice) : rawAtdps;
        const aggA = {};
        filteredA.forEach(r => {
            if (!aggA[r.code]) aggA[r.code] = { name: r.name, qty: 0, count: 0 };
            aggA[r.code].qty += r.qty;
            aggA[r.code].count += r.count;
        });

        let targetS = rawSettings.filter(r => r.deviceId === targetDevice);
        let outBase = targetS.map(s => {
            let a = aggA[s.code] || { qty: 0, count: 0 };
            let row = { 약품코드: s.code, 약품명: s.name, 번호: s.canNo, 수량: a.qty, 횟수: a.count };
            otherDevices.forEach(d => { row[d] = deviceCanMap[d][s.code] || ''; });
            return row;
        });

        dupData = [];
        if (isMerged) {
            let numGroups = {};
            outBase.forEach(r => {
                if(!numGroups[r.번호]) numGroups[r.번호] = [];
                numGroups[r.번호].push(r);
            });

            let newOutBase = [];
            for (let num in numGroups) {
                let group = numGroups[num];
                let uniqueNames = new Set(group.map(g => g.약품명));
                if (group.length > 1 && uniqueNames.size === 1) {
                    let sumQty = group.reduce((s, g) => s + g.수량, 0);
                    let sumCount = group.reduce((s, g) => s + g.횟수, 0);
                    let best = group.reduce((prev, curr) => (prev.수량 > curr.수량) ? prev : curr);
                    
                    let mergedRow = { 약품코드: best.약품코드, 약품명: best.약품명, 번호: Number(num), 수량: sumQty, 횟수: sumCount };
                    otherDevices.forEach(d => { mergedRow[d] = deviceCanMap[d][best.약품코드] || ''; });
                    
                    newOutBase.push(mergedRow);
                    dupData.push({...mergedRow, 상태: '💡통합결과'});
                } else {
                    newOutBase.push(...group);
                }
            }
            outBase = newOutBase;
        }

        let assignedCodes = new Set(outBase.map(r => r.약품코드));
        inData = [];
        for (let code in aggA) {
            if (!assignedCodes.has(code)) {
                let row = { 약품코드: code, 약품명: aggA[code].name, 수량: aggA[code].qty, 횟수: aggA[code].count };
                otherDevices.forEach(d => { row[d] = deviceCanMap[d][code] || ''; });
                inData.push(row);
            }
        }
        outData = outBase;

        let usedCans = new Set(outData.map(r => r.번호));
        let missingCans = new Set();
        for(let i=1; i<=maxCan; i++) if(!usedCans.has(i)) missingCans.add(i);
        
        // 기기별 등록된 오토 배열 가져오기 (없으면 빈 객체 반환)
        const currentAutos = autoMap[productPrefix] || {}; 
        let usedAutos = [];
        
        for (let aName in currentAutos) {
            let isSubset = currentAutos[aName].every(val => missingCans.has(val));
            if (isSubset) {
                usedAutos.push(aName);
                currentAutos[aName].forEach(val => missingCans.delete(val));
            }
        }
        let missingList = Array.from(missingCans).sort((a,b)=>a-b);

        let counts = {};
        outData.forEach(r => { counts[r.번호] = (counts[r.번호] || 0) + 1; });
        let dupNums = Object.keys(counts).filter(k => counts[k] > 1).map(Number);
        
        let dupDiffName = [], dupSameName = [];
        dupNums.forEach(num => {
            let names = new Set(outData.filter(r => r.번호 === num).map(r => r.약품명));
            if (names.size > 1) dupDiffName.push(num);
            else dupSameName.push(num);
            
            outData.filter(r => r.번호 === num).forEach(r => {
                dupData.push({...r, 상태: '원본'});
            });
        });

        let tMiss = missingList.length ? `미사용: <br>${missingList.join(', ')}` : "미사용: <br>없음";
        let tAuto = usedAutos.length ? `오토사용: <br>${usedAutos.join(', ')}` : "오토사용: <br>없음";
        let tDup1 = dupDiffName.length ? `중복지정: <br>${dupDiffName.sort((a,b)=>a-b).join(', ')}` : "중복지정: <br>없음";
        let tDup2 = dupSameName.length ? `중복코드: <br>${dupSameName.sort((a,b)=>a-b).join(', ')}` : "중복코드: <br>없음";
        
        document.getElementById('status-info').innerHTML = `
            <div>${tMiss}</div>
            <div>${tAuto}</div>
            <div>${tDup1}</div>
            <div>${tDup2}</div>
        `;

        renderTable('out', outData, ['숨기기', '약품코드', '약품명', '번호', '수량', '횟수', ...otherDevices]);
        renderTable('in', inData, ['숨기기', '약품코드', '약품명', '수량', '횟수', ...otherDevices]);
        renderTable('dup', dupData, ['상태', '약품코드', '약품명', '번호', '수량', '횟수', ...otherDevices]);

        if (showPopup) alert("데이터 갱신이 완료되었습니다.");
    }

    function renderTable(tabId, data, columns) {
        const tbody = document.querySelector(`#table-${tabId} tbody`);
        const thead = document.querySelector(`#table-${tabId} thead`);
        tbody.innerHTML = ''; thead.innerHTML = '';
        
        let trH = document.createElement('tr');
        columns.forEach(col => {
            let th = document.createElement('th');
            th.textContent = col;
            if (col !== '숨기기') {
                th.onclick = () => {
                    let asc = currentSort[tabId].col === col ? !currentSort[tabId].asc : true;
                    currentSort[tabId] = { col: col, asc: asc };
                    sortData(tabId, col, asc);
                    renderTable(tabId, data, columns);
                };
            }
            trH.appendChild(th);
        });
        thead.appendChild(trH);

        let sortConf = currentSort[tabId];
        data.sort((a, b) => {
            let valA = a[sortConf.col]; let valB = b[sortConf.col];
            if (valA === '' || valA == null) return 1; 
            if (valB === '' || valB == null) return -1;
            if (typeof valA === 'string') {
                return sortConf.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                return sortConf.asc ? valA - valB : valB - valA;
            }
        });

        data.forEach(row => {
            let tr = document.createElement('tr');
            columns.forEach(col => {
                let td = document.createElement('td');
                if (col === '숨기기') {
                    let btn = document.createElement('button');
                    btn.className = 'btn-hide-row'; btn.textContent = '숨기기';
                    btn.onclick = function() { tr.classList.add('hidden'); document.getElementById('btn-unhide').style.display = 'inline-block'; };
                    td.appendChild(btn);
                } else {
                    td.textContent = row[col];
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function sortData(tabId, col, asc) {}

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.target.classList.add('active');
        searchIndex[tabId] = -1; 
    }

    function unhideAll() {
        document.querySelectorAll('tr.hidden').forEach(tr => tr.classList.remove('hidden'));
        document.getElementById('btn-unhide').style.display = 'none';
    }

    function performSearch() {
        const keyword = document.getElementById('input-search').value.trim().toLowerCase();
        if (!keyword) return;

        const activeTabBtn = document.querySelector('.tab-btn.active');
        let tabId = 'out';
        if (activeTabBtn.textContent.includes('In')) tabId = 'in';
        else if (activeTabBtn.textContent.includes('중복')) tabId = 'dup';

        const colName = document.getElementById('combo-search-col').value;
        const thead = document.querySelector(`#table-${tabId} thead tr`);
        let targetColIdx = -1;
        
        Array.from(thead.children).forEach((th, idx) => {
            if (th.textContent === colName) targetColIdx = idx;
        });

        if (targetColIdx === -1) {
            alert(`현재 열려있는 목록에는 '${colName}' 열이 존재하지 않습니다.\n검색 설정을 변경해 주세요.`); return;
        }

        const tbody = document.querySelector(`#table-${tabId} tbody`);
        const rows = Array.from(tbody.children);
        
        rows.forEach(r => r.classList.remove('highlight'));

        let start = searchIndex[tabId] + 1;
        let found = false;

        for (let i = 0; i < rows.length; i++) {
            let rIdx = (start + i) % rows.length;
            let tr = rows[rIdx];
            if (tr.classList.contains('hidden')) continue;
            
            let text = tr.children[targetColIdx].textContent.toLowerCase();
            if (text.includes(keyword)) {
                searchIndex[tabId] = rIdx;
                tr.classList.add('highlight');
                tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
                found = true;
                break;
            }
        }

        if (!found) alert("일치하는 데이터가 더 이상 없습니다.");
    }
</script>
